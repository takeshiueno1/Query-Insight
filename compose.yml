services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-query_insight}
      POSTGRES_USER: ${DB_USER:-query_insight}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-query_insight_local}
      TZ: UTC
    volumes:
      - query-insight-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-query_insight} -d ${DB_NAME:-query_insight}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.1
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - query-insight-ollama:/root/.ollama
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - query-insight-clamav:/var/lib/clamav
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-query_insight}
      DB_USER: ${DB_USER:-query_insight}
      DB_PASSWORD: ${DB_PASSWORD:-query_insight_local}
      AUTH_SECURE_COOKIE: "false"
      JWT_ALLOW_EPHEMERAL_KEY: "true"
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-PT5M}
      CLAMAV_HOST: clamav
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8088:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  query-insight-postgres:
  query-insight-ollama:
  query-insight-clamav:
