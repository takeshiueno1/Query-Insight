services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-query_insight}
      POSTGRES_USER: ${DB_USER:-query_insight}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-query_insight_local}
      TZ: UTC
    volumes:
      - query-insight-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-query_insight} -d ${DB_NAME:-query_insight}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-query_insight}
      DB_USER: ${DB_USER:-query_insight}
      DB_PASSWORD: ${DB_PASSWORD:-query_insight_local}
      AUTH_SECURE_COOKIE: "false"
      JWT_ALLOW_EPHEMERAL_KEY: "true"
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8088:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  query-insight-postgres:
