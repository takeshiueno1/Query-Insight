spring:
  application:
    name: query-insight
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/query_insight}
    username: ${DB_USER:query_insight}
    password: ${DB_PASSWORD:query_insight_local}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  jackson:
    time-zone: UTC
server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  files:
    max-size-bytes: 5242880
    max-per-submission: 3
    scan-scheduler-enabled: ${FILE_SCAN_SCHEDULER_ENABLED:true}
    scan-retry-fixed-delay: PT1M
    scan-retry-initial-delay: PT1M
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout: PT2S
      read-timeout: PT30S
  auth:
    issuer: ${JWT_ISSUER:query-insight}
    access-token-ttl: PT15M
    refresh-token-ttl: PT8H
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    allow-ephemeral-key: ${JWT_ALLOW_EPHEMERAL_KEY:false}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:8088}
  features:
    ai-enabled: ${AI_ENABLED:false}
  ai:
    provider: ${AI_PROVIDER:ollama}
  security:
    rate-limit:
      max-entries: ${RATE_LIMIT_MAX_ENTRIES:10000}
      login:
        max-requests: ${LOGIN_RATE_LIMIT_MAX:10}
        window: ${LOGIN_RATE_LIMIT_WINDOW:PT1M}
      refresh:
        max-requests: ${REFRESH_RATE_LIMIT_MAX:30}
        window: ${REFRESH_RATE_LIMIT_WINDOW:PT1M}
      password-reset:
        max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX:3}
        window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:PT10M}
      ai:
        max-requests: ${AI_RATE_LIMIT_MAX:3}
        window: ${AI_RATE_LIMIT_WINDOW:PT10M}
        max-concurrent: ${AI_MAX_CONCURRENT:1}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      employee-no: ${BOOTSTRAP_ADMIN_EMPLOYEE_NO:}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:4b}
    request-timeout: ${OLLAMA_REQUEST_TIMEOUT:PT5M}
